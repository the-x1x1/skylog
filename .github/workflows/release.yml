name: Release

# Builds the Windows desktop program and attaches it, with the single-file app and checksums, to a
# GitHub release. Runs when a release is published. To rebuild the files for an existing tag, run it
# by hand from the Actions tab (or: gh workflow run release.yml -f tag=v0.1.0).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach files to (for example v0.1.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and attach the Windows executable
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the tag matches package.json
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) {
            throw "Tag $env:TAG does not match package.json version $version. Set the version in package.json, commit, and tag v$version."
          }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the executable and single-file app
        run: npm run build:release

      - name: Smoke-test the executable
        run: npm run smoke:exe

      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:TAG --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            $notes = "docs/release-notes/$($env:TAG).md"
            if (Test-Path $notes) { gh release create $env:TAG --verify-tag --notes-file $notes }
            else { gh release create $env:TAG --verify-tag --generate-notes }
            if ($LASTEXITCODE -ne 0) { throw "Could not create release $env:TAG." }
          }
          $files = (Get-ChildItem release -File).FullName
          gh release upload $env:TAG @files --clobber
          if ($LASTEXITCODE -ne 0) { throw "Uploading to release $env:TAG failed." }
          Get-ChildItem release -File | ForEach-Object { Write-Host "Attached $($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)" }
